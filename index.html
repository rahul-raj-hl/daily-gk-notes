<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC - GS</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">SSC</span>
            <span class="brand-sub">General Studies</span>
        </div>

        <div class="topbar-actions">
            <button id="revision-btn" class="revision-trigger" type="button">
                <span aria-hidden="true">⚡</span> Quick Revision
            </button>
            <button id="search-btn" class="search-trigger" type="button">
                <span aria-hidden="true">🔍</span> Search <kbd>/</kbd>
            </button>
            <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode">🌙</button>
        </div>
    </header>

    <div class="progress" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <main class="stage">
        <article id="content" class="card" aria-live="polite">
            <p class="status">Loading…</p>
        </article>
    </main>

    <nav class="pager">
        <button id="prev-btn" class="nav-btn" type="button">
            <span aria-hidden="true">←</span> Previous
        </button>
        <span id="counter" class="counter">–</span>
        <button id="next-btn" class="nav-btn nav-btn-primary" type="button">
            Next <span aria-hidden="true">→</span>
        </button>
    </nav>

    <div id="search-overlay" class="overlay" hidden>
        <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search cards">
            <input id="search-input" class="search-input" type="text" autocomplete="off"
                   placeholder="Search by title, or type a card number…">
            <ul id="search-results" class="search-results"></ul>
            <p class="search-hint">↑↓ to move · Enter to open · Esc to close</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="./index.js"></script>
</body>
</html>
